name: Atualizar radares do OpenStreetMap

# Todo dia 1º às 06:00 de Brasília (09:00 UTC); também dá para rodar à mão na aba Actions.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar radares do Brasil (extrato da Geofabrik)
        run: |
          pip install osmium
          python ferramentas/baixar_osm.py
      - name: Publicar se mudou
        run: |
          git add osm-brasil.json
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza radares do OpenStreetMap"
          git push
